/**:
  ros__parameters:
    name: 'husky'
    world_frame: 'world'
    sensor_frame: 'husky/base_link'
    base_link_frame: 'husky/base_link'
    platform_modality: 0  ## 0: Ground robot, 1: Aerial robot
    run_mode: 0  ## 0: Onboard, 1: Debug
    sensor_modality: 0
    sensor_range:
    - 0.3
    - 10.0
    fov:
    - 69.4
    - 45.0
    aspect_ratio: 1.33
    sensor_rotation:
    - 0.0
    - 0.0
    - -1.57
    sensor_translation:
    - 0.0
    - 0.0
    - 0.0
    rate_controller: 5.0
    cmd_pos_upd: 25.0
    cmd_yaw_upd: 3.14
    confidence_horizon: 5
    inspection_distance: 1.5
    photogrammetric_params:
    - 0.8
    - 0.01
    prediction_horizon: 10
    inspection_height: 1.0
    odom_topic: odometry/imu
    pcl_topic: filtered_pointcloud
    # pcl_topic: ouster/points
    reference_pose: command/pose
    inspection_performance: inspection_planner/results/inspection_performance
    tracked_path: inspection_planner/results/tracked_path
    predicted_path: inspection_planner/results/predicted_path
    maintained_distance: inspection_planner/results/maintained_distance
    cropped_points: inspection_planner/results/cropped_points
    cam_frustum: inspection_planner/general/camera_frustum
