services:
  ros2:
    build: .
    image: jazzy_planning_dev:latest
    container_name: jazzy_planning_dev

    # Best option for ROS 2 on LAN (DDS multicast/discovery, robot connectivity)
    network_mode: host

    # For accessing /dev devices if needed (lidar, joystick, etc.)
    privileged: true

    environment:
      # X11 GUI
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      # Optional: keep domain consistent across machines
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
      # Optional: force a DDS implementation if you want
      # - RMW_IMPLEMENTATION=rmw_fastrtps_cpp

    volumes:
      # X11 socket
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Your workspace (edit path on the left if you want)
      - ../../../:/inspection_ws:rw
      # Persist ROS logs
      - ~/.ros:/root/.ros:rw

    stdin_open: true
    tty: true
